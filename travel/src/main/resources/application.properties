spring.application.name=travel
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dHJhdmVsLWFnZW5jeS1qd3Qtc2VjcmV0LWtleS0yMDI2ISE=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional admin bootstrap. Leave blank to skip automatic admin creation.
app.admin.name=${ADMIN_NAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Seeds the 25-district destination catalogue once. Existing names are never overwritten.
app.destination-seed.enabled=${DESTINATION_SEED_ENABLED:true}

# Spring Boot Actuator health endpoints for Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true