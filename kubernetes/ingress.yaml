apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: travel-app-ingress

spec:
  ingressClassName: traefik

  rules:
    - host: travel.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: travel-backend-service
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: travel-frontend-service
                port:
                  number: 80