name: Travel Agency CI/CD

on:
  push:
    branches:
      - devops-version-1

  pull_request:
    branches:
      - devops-version-1

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Give Maven Wrapper Permission
        run: chmod +x travel/mvnw

      - name: Build Spring Boot Application
        working-directory: travel
        run: ./mvnw clean package -DskipTests

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./travel
          push: true
          tags: |
            ghcr.io/induwara09/travel-agency-backend:latest
            ghcr.io/induwara09/travel-agency-backend:${{ github.sha }}
              - name: Build and Push Frontend Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/induwara09/travel-agency-frontend:latest
            ghcr.io/induwara09/travel-agency-frontend:${{ github.sha }}